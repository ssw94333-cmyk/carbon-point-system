spring:
  application:
    name: carbon-point-system
  # 激活开发环境配置
  profiles:
    active: dev
  datasource:
    driver-class-name: ${spring.datasource.driver-class-name}
    url: ${spring.datasource.url}
    username: ${spring.datasource.username}
    password: ${spring.datasource.password}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

server:
  port: ${server.port}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: ${mybatis-plus.configuration.log-impl}
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath:mapper/*.xml

jwt:
  secret: ${jwt.secret}
  expiration: ${jwt.expiration}

# 阿里云OSS配置
aliyun:
  oss:
    enabled: ${aliyun.oss.enabled}
    endpoint: ${aliyun.oss.endpoint}
    access-key-id: ${aliyun.oss.access-key-id}
    access-key-secret: ${aliyun.oss.access-key-secret}
    bucket-name: ${aliyun.oss.bucket-name}
    prefix: ${aliyun.oss.prefix}
